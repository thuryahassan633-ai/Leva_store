<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leva | لوحة التحكم</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf7ff;color:#3e3348;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #3e334812}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab{border:0;border-radius:999px;padding:11px 16px;background:#fff;white-space:nowrap}.active,.primary{background:#9b7ede!important;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}label{display:block;font-weight:700;font-size:13px;margin:8px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #e5dced;border-radius:12px;font-size:15px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.ghost{background:#f5eff9}.danger{background:#fff0f0;color:#a33;border:0;border-radius:10px;padding:9px}.row{display:flex;gap:8px;flex-wrap:wrap}.product,.order{border:1px solid #eee5f0;border-radius:16px;padding:12px;margin:9px 0}.muted{font-size:13px;color:#766a7d}.hidden{display:none}.notice{background:#f5effb;padding:13px;border-radius:14px;line-height:1.7}.success{background:#edf9f0;padding:12px;border-radius:12px;display:none}.error{background:#fff0f0;padding:12px;border-radius:12px;display:none}.login{max-width:430px;margin:12vh auto}.logout{background:#fff0f0;color:#933;border:0;border-radius:10px;padding:9px 12px}@media(max-width:600px){.top{align-items:flex-start}}
</style></head><body><div class="wrap"><section id="loginCard" class="card login"><h1>Leva | ليڤـا 🌸</h1><p class="muted">دخول لوحة التحكم</p><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:14px" id="loginBtn">دخول</button><div id="loginError" class="error" style="margin-top:12px"></div></section>
<section id="app" class="hidden"><div class="top"><div><h1>Leva | ليڤـا 🌸</h1><div class="muted">لوحة التحكم السحابية</div></div><div class="row"><a class="btn primary" href="index.html">فتح المتجر ↗</a><button class="logout" id="logoutBtn">تسجيل الخروج</button></div></div><div class="notice">أي تعديل هنا يُحفظ في Supabase ويظهر للزوار من الأجهزة المختلفة. لا تشاركي كلمة مرور لوحة التحكم مع أي شخص.</div>
<div class="tabs"><button class="tab active" onclick="show('design',this)">🎨 التصميم</button><button class="tab" onclick="show('brand',this)">🏪 الهوية</button><button class="tab" onclick="show('products',this)">🛍️ المنتجات</button><button class="tab" onclick="show('orders',this)">📦 الطلبات</button></div>
<section id="design" class="card"><h2>🎨 الألوان</h2><div class="grid"><div><label>الأساسي</label><input id="primary" type="color"></div><div><label>الثانوي</label><input id="secondary" type="color"></div><div><label>الذهبي</label><input id="accent" type="color"></div><div><label>الخلفية</label><input id="cream" type="color"></div><div><label>النص</label><input id="text" type="color"></div></div><button class="btn primary" onclick="saveTheme()">حفظ وتطبيق 🎨</button></section>
<section id="brand" class="card hidden"><h2>🏪 هوية المتجر</h2><div class="grid"><div><label>اسم المتجر</label><input id="bn"></div><div><label>الاسم بالعربي</label><input id="ba"></div><div><label>واتساب</label><input id="bw"></div></div><label>العبارة الرئيسية</label><input id="bt"><label>الوصف</label><textarea id="bd"></textarea><button class="btn primary" style="margin-top:12px" onclick="saveBrand()">حفظ الهوية</button></section>
<section id="products" class="card hidden"><h2>🛍️ المنتجات</h2><div id="plist"></div><hr><h3>إضافة منتج</h3><div class="grid"><div><label>اسم المنتج</label><input id="pn"></div><div><label>القسم</label><select id="pc"><option value="grad">التخرج</option><option value="birth">المواليد</option><option value="gifts">المناسبات</option></select></div><div><label>السعر</label><input id="pp" type="number" min="0"></div><div><label>الصورة</label><input id="pfile" type="file" accept="image/*"></div></div><label>الوصف</label><textarea id="pd"></textarea><button class="btn primary" style="margin-top:12px" onclick="addProduct()">إضافة المنتج</button></section>
<section id="orders" class="card hidden"><h2>📦 الطلبات</h2><div id="olist">جاري التحميل...</div></section><div id="ok" class="success" style="margin-top:12px">تم الحفظ بنجاح.</div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
